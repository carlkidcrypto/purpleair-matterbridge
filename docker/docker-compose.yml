services:
  purpleair-matterbridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MATTERBRIDGE_VERSION: "3.10.3"
        LOGGER_REF: "main"
    container_name: purpleair-matterbridge
    network_mode: host
    restart: unless-stopped
    environment:
      LOGGER_ARGS: ${LOGGER_ARGS:?Set LOGGER_ARGS to the logger configuration}
    volumes:
      - matterbridge-data:/data/matterbridge
      - logger-data:/data/logger

volumes:
  matterbridge-data:
  logger-data: