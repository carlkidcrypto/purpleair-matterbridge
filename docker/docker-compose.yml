services:
  purpleair-matterbridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: purpleair-matterbridge
    network_mode: host
    restart: unless-stopped
    environment:
      PURPLEAIR_LOGGER_MODE: ${PURPLEAIR_LOGGER_MODE:?Set --local or --remote}
      MDNS_INTERFACE: ${MDNS_INTERFACE:-}
    volumes:
      - matterbridge-data:/data
      - logger-data:/data/logger
      - ${PURPLEAIR_SETTINGS_FILE:?Set PURPLEAIR_SETTINGS_FILE to the PurpleAir settings JSON file}:/config/purpleair-settings.json:ro

volumes:
  matterbridge-data:
  logger-data:
