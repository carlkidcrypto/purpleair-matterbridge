name: Publish npm Package
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_npm_publish.yml@14e025f6c182b7b20718538f533ca467a9ff9c6c
    with:
      install-cmd: 'npm ci && npm install -g matterbridge@3.10.7 && npm link matterbridge'
      test-cmd: 'npm run typecheck && npm test && npm run lint && npm run format:check'
