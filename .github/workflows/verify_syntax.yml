name: Validate Workflow Files

concurrency:
  group: verify_syntax-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '!.github/workflows/*.lock.yml'
      - '!.github/workflows/*.lock.yaml'
      - '!.github/workflows/agentics-maintenance.yml'
      - '.yamllint'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '!.github/workflows/*.lock.yml'
      - '!.github/workflows/*.lock.yaml'
      - '!.github/workflows/agentics-maintenance.yml'
      - '.yamllint'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_verify_syntax.yml@eeefdd5c0a594d59ae86a09437b2de9bb57618a3

  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install pytest
        run: python -m pip install --only-binary ":all:" pytest==8.3.5

      - name: Run CI helper script tests
        run: python -m pytest .github/scripts/tests
