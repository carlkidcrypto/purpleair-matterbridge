name: Validate Workflow Files
concurrency:
  group: "${{ github.repository }}-${{ github.workflow }}"
  cancel-in-progress: true

on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yamllint pytest

      - name: Lint workflow YAML files
        run: |
          set -e
          echo "Linting workflow YAML files (excluding lock and agentics maintenance files) in .github/workflows/ ..."
          find .github/workflows/ -name "*.yml" ! -name "*.lock.yml" ! -name "agentics-maintenance.yml" | xargs yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}"
          echo "All workflow YAML files passed linting."

      - name: Run CI helper script tests
        run: |
          python -m pytest .github/scripts/tests

