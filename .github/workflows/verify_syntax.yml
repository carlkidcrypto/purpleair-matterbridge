name: Validate Workflow Files

concurrency:
  group: verify_syntax-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '!.github/workflows/*.lock.yml'
      - '!.github/workflows/*.lock.yaml'
      - '!.github/workflows/agentics-maintenance.yml'
      - '.yamllint'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '!.github/workflows/*.lock.yml'
      - '!.github/workflows/*.lock.yaml'
      - '!.github/workflows/agentics-maintenance.yml'
      - '.yamllint'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_verify_syntax.yml@1d9ff61f23b14bedea72a8ac16f0e80ebe8d1d0e

  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.14"

      - name: Install pytest
        run: python -m pip install --only-binary ":all:" pytest==8.3.5

      - name: Run CI helper script tests
        run: python -m pytest .github/scripts/tests
