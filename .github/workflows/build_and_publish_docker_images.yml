name: Build and Publish Docker Image

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  DOCKER_REPO: carlkidcrypto/purpleair-matterbridge-images
  GHCR_REPO: ghcr.io/carlkidcrypto/purpleair-matterbridge

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          short_sha="${GITHUB_SHA::12}"
          unique_suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "version=${version}"
            echo "short_sha=${short_sha}"
            echo "unique_suffix=${unique_suffix}"
            echo "docker_tags<<EOF"
            echo "${DOCKER_REPO}:${version}-${short_sha}-${unique_suffix}"
            echo "${GHCR_REPO}:${version}-${short_sha}-${unique_suffix}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          pull: true
          build-args: |
            MATTERBRIDGE_VERSION=3.10.3
          tags: ${{ steps.tags.outputs.docker_tags }}
          labels: |
            org.opencontainers.image.title=purpleair-matterbridge
            org.opencontainers.image.description=Matterbridge plugin with the PurpleAir data logger
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=purpleair-matterbridge
          cache-to: type=gha,mode=max,scope=purpleair-matterbridge
