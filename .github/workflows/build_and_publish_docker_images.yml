name: Build and Publish Docker Image

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/**
      - package.json
      - package-lock.json
      - src/**
      - .github/workflows/build_and_publish_docker_images.yml

env:
  DOCKER_REPO: carlkidcrypto/purpleair-matterbridge
  GHCR_REPO: ghcr.io/carlkidcrypto/purpleair-matterbridge

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          short_sha="${GITHUB_SHA::12}"
          {
            echo "version=${version}"
            echo "short_sha=${short_sha}"
            echo "docker_tags<<EOF"
            echo "${DOCKER_REPO}:${version}"
            echo "${DOCKER_REPO}:latest"
            echo "${DOCKER_REPO}:sha-${short_sha}"
            echo "${GHCR_REPO}:${version}"
            echo "${GHCR_REPO}:latest"
            echo "${GHCR_REPO}:sha-${short_sha}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          pull: true
          build-args: |
            MATTERBRIDGE_VERSION=3.10.3
            LOGGER_VERSION=1.5.0a2
          tags: ${{ steps.tags.outputs.docker_tags }}
          labels: |
            org.opencontainers.image.title=purpleair-matterbridge
            org.opencontainers.image.description=Matterbridge plugin with the PurpleAir data logger
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=purpleair-matterbridge
          cache-to: type=gha,mode=max,scope=purpleair-matterbridge
