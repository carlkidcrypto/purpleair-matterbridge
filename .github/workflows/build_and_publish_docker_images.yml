name: Build and Publish Docker Image

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prepare-metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Compute image tags and labels
        id: meta
        shell: bash
        env:
          DOCKER_REPO: carlkidcrypto/purpleair-matterbridge-images
          GHCR_REPO: ghcr.io/carlkidcrypto/purpleair-matterbridge
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          short_sha="${GITHUB_SHA::12}"
          unique_suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${DOCKER_REPO}:${version}-${short_sha}-${unique_suffix}"
            echo "${GHCR_REPO}:${version}-${short_sha}-${unique_suffix}"
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.title=purpleair-matterbridge"
            echo "org.opencontainers.image.description=Matterbridge plugin with the PurpleAir data logger"
            echo "org.opencontainers.image.version=${version}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  build-and-push:
    needs: prepare-metadata
    permissions:
      contents: read
      packages: write
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_docker_publish.yml@22f04e222fa07048891327e4d34bb174d36e7bfa
    with:
      docker-repo: carlkidcrypto/purpleair-matterbridge-images
      ghcr-repo: ghcr.io/carlkidcrypto/purpleair-matterbridge
      context: .
      dockerfile: docker/Dockerfile
      push: true
      tags: ${{ needs.prepare-metadata.outputs.tags }}
      labels: ${{ needs.prepare-metadata.outputs.labels }}
      cache-scope: purpleair-matterbridge
      timeout-minutes: 120
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
