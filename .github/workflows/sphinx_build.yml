name: "Sphinx Docs Build"

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sphinx_docs_build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12 for Sphinx
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sphinx-${{ hashFiles('sphinx_docs_build/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-sphinx-
            ${{ runner.os }}-pip-

      - name: Install Sphinx requirements
        run: python -m pip install -r sphinx_docs_build/requirements.txt

      - name: Build Sphinx documentation
        working-directory: sphinx_docs_build
        run: make clean && make html SPHINXOPTS="-W"

      - name: Install landing page requirements
        run: python -m pip install -r sphinx_docs_build/landing/requirements.txt

      - name: Build landing page
        working-directory: sphinx_docs_build/landing
        run: make clean && make html SPHINXOPTS="-W"

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/

  deploy_pages:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: sphinx_docs_build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  version_release_docs:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Validate release tag
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version, received: $VERSION" >&2
            exit 1
          fi

      - name: Set up Python 3.12 for Sphinx
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Sphinx requirements
        run: python -m pip install -r sphinx_docs_build/requirements.txt

      - name: Build release documentation
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p "/tmp/html_${VERSION}"
          cd sphinx_docs_build
          make clean
          sphinx-build -b html -W -D release="${VERSION}" source "/tmp/html_${VERSION}"

      - name: Check out main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Copy locked documentation and update landing page
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p docs
          cp -R "/tmp/html_${VERSION}" "docs/html_${VERSION}"
          python3 - <<'EOF'
          import pathlib
          import re

          docs_dir = pathlib.Path("docs")
          index_path = pathlib.Path("sphinx_docs_build/landing/source/index.rst")
          versions = sorted(
              (path.name.removeprefix("html_") for path in docs_dir.iterdir()
               if path.is_dir() and path.name.startswith("html_")),
              reverse=True,
          )
          entries = ["* `Latest Version <./html/index.html>`_", ""]
          entries.extend(f"* `{version} <./html_{version}/index.html>`_" for version in versions)
          replacement = ".. VERSION_LIST_START\n\n" + "\n".join(entries) + "\n\n.. VERSION_LIST_END"
          content = index_path.read_text()
          updated, count = re.subn(
              r"\.\. VERSION_LIST_START\n.*?\.\. VERSION_LIST_END",
              replacement,
              content,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit("landing page version-list sentinels not found exactly once")
          index_path.write_text(updated)
          EOF

      - name: Install landing page requirements
        run: python -m pip install -r sphinx_docs_build/landing/requirements.txt

      - name: Build landing page
        working-directory: sphinx_docs_build/landing
        run: make clean && make html SPHINXOPTS="-W"

      - name: Commit and push locked documentation to main
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            docs/.nojekyll \
            "docs/html_${VERSION}/" \
            sphinx_docs_build/landing/source/index.rst \
            docs/index.html \
            docs/.buildinfo \
            docs/_static/ \
            docs/_sources/ \
            docs/genindex.html \
            docs/search.html \
            docs/searchindex.js \
            docs/objects.inv \
            || true
          git diff --cached --quiet || git commit -m "docs: add versioned documentation for ${VERSION}"
          git push origin main