name: "Sphinx Docs Build"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sphinx_docs_build:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_sphinx_build.yml@22f04e222fa07048891327e4d34bb174d36e7bfa
    with:
      landing-dir: 'sphinx_docs_build/landing'
      extra-requirements-file: 'sphinx_docs_build/landing/requirements.txt'
      deploy-pages: true

  version_release_docs:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Validate release tag
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-]?[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version, received: $VERSION" >&2
            exit 1
          fi

      - name: Set up Python 3.14 for Sphinx
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install Sphinx requirements
        run: python -m pip install -r sphinx_docs_build/requirements.txt

      - name: Build release documentation
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p "/tmp/html_${VERSION}"
          cd sphinx_docs_build
          make clean
          sphinx-build -b html -W -D release="${VERSION}" source "/tmp/html_${VERSION}"

      - name: Check out main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Copy locked documentation and update landing page
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p docs
          rm -rf "docs/html_${VERSION}"
          cp -r "/tmp/html_${VERSION}" "docs/html_${VERSION}"
          python3 - <<'EOF'
          import pathlib
          import re

          def sort_key(ver_str):
              try:
                  from packaging.version import parse
                  return parse(ver_str.lstrip("v"))
              except Exception:
                  return ver_str

          docs_dir = pathlib.Path("docs")
          index_path = pathlib.Path("sphinx_docs_build/landing/source/index.rst")
          raw_versions = [
              path.name.removeprefix("html_")
              for path in docs_dir.iterdir()
              if path.is_dir() and path.name.startswith("html_")
          ]
          versions = sorted(raw_versions, key=sort_key, reverse=True)
          entries = ["* `Latest Version <./html/index.html>`_", ""]
          entries.extend(f"* `{version} <./html_{version}/index.html>`_" for version in versions)
          replacement = ".. VERSION_LIST_START\n\n" + "\n".join(entries) + "\n\n.. VERSION_LIST_END"
          content = index_path.read_text()
          updated, count = re.subn(
              r"\.\. VERSION_LIST_START\n.*?\.\. VERSION_LIST_END",
              replacement,
              content,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit("landing page version-list sentinels not found exactly once")
          index_path.write_text(updated)
          EOF

      - name: Install landing page requirements
        run: python -m pip install -r sphinx_docs_build/landing/requirements.txt

      - name: Build landing page
        working-directory: sphinx_docs_build/landing
        run: make clean && make html SPHINXOPTS="-W"

      - name: Create pull request for locked documentation
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v7
        with:
          token: ${{ github.token }}
          commit-message: "docs: add versioned documentation for ${{ github.event.release.tag_name }}"
          title: "docs: add versioned documentation for ${{ github.event.release.tag_name }}"
          body: |
            Adds locked Sphinx documentation for release `${{ github.event.release.tag_name }}`.

            Built from release tag `${{ github.event.release.tag_name }}` in workflow run `${{ github.run_id }}`.
          branch: docs/add-versioned-docs-${{ github.event.release.tag_name }}
          base: main
          delete-branch: true
          add-paths: |
            docs/
            sphinx_docs_build/landing/source/index.rst
