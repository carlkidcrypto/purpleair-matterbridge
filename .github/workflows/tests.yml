name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - src/**
      - vitest/**
      - package.json
      - package-lock.json
      - tsconfig*.json
      - vitest.config.ts
      - .github/workflows/tests.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci
      
      - name: Install and Link Matterbridge for CI
        run: |
          npm install -g matterbridge@3.10.7
          npm link matterbridge

      - name: Check formatting
        run: npm run format:check

      - name: Lint package
        run: npm run lint

      - name: Typecheck package
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build
