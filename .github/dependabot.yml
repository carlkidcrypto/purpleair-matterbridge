version: 2
updates:
  - directory: /
    open-pull-requests-limit: 10
    package-ecosystem: github-actions
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns:
          - "*"
    # Agentic workflow lock files are auto-generated by gh aw compile.
    # Dependabot should not open PRs for those manifests.
    exclude-paths:
      - ".github/workflows/agentics-maintenance.yml"
      - ".github/workflows/*.lock.yml"
      - ".github/workflows/*.md"
      - ".github/agents/*.md"
      - ".github/aw/*.lock.json"
  - directory: /
    open-pull-requests-limit: 10
    package-ecosystem: npm
    schedule:
      interval: daily
    groups:
      npm-dependencies:
        patterns:
          - "*"
  - directory: /docker
    open-pull-requests-limit: 10
    package-ecosystem: docker
    schedule:
      interval: daily
  - directory: /docker
    open-pull-requests-limit: 10
    package-ecosystem: pip
    schedule:
      interval: daily
    groups:
      python-dependencies:
        patterns:
          - "*"
  - directory: /docker
    open-pull-requests-limit: 10
    package-ecosystem: npm
    schedule:
      interval: daily
    groups:
      npm-dependencies:
        patterns:
          - "*"
  - directory: /sphinx_docs_build
    open-pull-requests-limit: 10
    package-ecosystem: pip
    schedule:
      interval: daily
    groups:
      python-dependencies:
        patterns:
          - "*"
  - directory: /sphinx_docs_build/landing
    open-pull-requests-limit: 10
    package-ecosystem: pip
    schedule:
      interval: daily
    groups:
      python-dependencies:
        patterns:
          - "*"
