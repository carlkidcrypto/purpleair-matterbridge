updates:
  - directory: /
    open-pull-requests-limit: 10
    package-ecosystem: github-actions
    schedule:
      interval: daily
    # Agentic workflow lock files are auto-generated by gh aw compile.
    # Dependabot should not open PRs for those manifests.
    exclude-paths:
      - ".github/workflows/*.lock.yml"
      - ".github/workflows/*.md"
  - directory: /
    open-pull-requests-limit: 10
    package-ecosystem: npm
    schedule:
      interval: daily
  - directory: /docker
    open-pull-requests-limit: 10
    package-ecosystem: docker
    schedule:
      interval: daily
  - directory: /sphinx_docs_build
    open-pull-requests-limit: 10
    package-ecosystem: pip
    schedule:
      interval: daily
  - directory: /sphinx_docs_build/landing
    open-pull-requests-limit: 10
    package-ecosystem: pip
    schedule:
      interval: daily
