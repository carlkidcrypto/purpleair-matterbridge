style: github

template: CHANGELOG.tpl.md

info:
  title: CHANGELOG
  repository_url: https://github.com/carlkidcrypto/purpleair-matterbridge

commit_groups:
  title_maps:
    feat: Features
    fix: Bug Fixes
    perf: Performance Improvements
    refactor: Code Refactoring
    docs: Documentation Updates
    chore: Maintenance
    build: Build System
    ci: Continuous Integration
    test: Tests
    style: Styles
    revert: Reverts
    Fix: Bug Fixes
    Refactor: Code Refactoring
    Bump: Dependency Updates
    Add: Features
    Update: Updates & Improvements
    Document: Documentation Updates
    Enhance: Enhancements
    Hotfix: Critical Bug Fixes
    Initial: Initial Setup
    Merge: Merged Pull Requests
    other: Other Changes

header:
  pattern: '^\\s*(([\\w]+)(?:[:\\s/-].*)?)$'
  pattern_maps:
    - Subject
    - Type

notes:
  keywords:
    - BREAKING CHANGE
